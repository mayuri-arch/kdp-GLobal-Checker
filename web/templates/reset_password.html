{% extends "_base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px; margin:40px auto;">
  <h2>Set New Password</h2>
  <p class="muted" style="font-size:13px; line-height:1.5; margin-bottom:20px;">
    Your recovery token is validated. Please enter your new secure password below to complete the recovery.
  </p>
  <form method="post" action="/auth/reset-password/{{ token }}">
    <div style="margin-bottom:16px;">
      <label>New Password</label>
      <input type="password" name="password" placeholder="At least 8 characters" minlength="8" required style="width:100%;" />
    </div>
    <button type="submit" style="width:100%;">Update Password</button>
  </form>
</div>
{% endblock %}
