{% extends "_base.html" %}
{% block title %}Recover Password{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px; margin:40px auto;">
  <h2>Recover Password</h2>
  <p class="muted" style="font-size:13px; line-height:1.5; margin-bottom:20px;">
    Enter your registered email address below, and we will generate a password recovery link to reset your credentials securely.
  </p>
  <form method="post" action="/auth/forgot-password">
    <div style="margin-bottom:16px;">
      <label>Email Address</label>
      <input type="email" name="email" placeholder="you@example.com" required style="width:100%;" />
    </div>
    <button type="submit" style="width:100%;">Generate Recovery Link</button>
    <div class="muted" style="margin-top:16px; font-size:13px;">
      Remembered your credentials? <a href="/auth/login">Back to Log in</a>
    </div>
  </form>
</div>
{% endblock %}
