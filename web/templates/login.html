{% extends "_base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px; margin:40px auto;">
  <h2>Log in</h2>
  <form method="post" action="/auth/login">
    <div style="margin-bottom:12px;"><label>Email</label><input type="email" name="email" required /></div>
    <div style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <label style="margin:0;">Password</label>
        <a href="/auth/forgot-password" style="font-size:12px;">Forgot password?</a>
      </div>
      <input type="password" name="password" required style="width:100%;" />
    </div>
    <button type="submit" style="width:100%;">Log in</button>
    <div class="muted" style="margin-top:16px; font-size:13px;">No account? <a href="/auth/signup">Sign up</a></div>
  </form>
</div>
{% endblock %}
